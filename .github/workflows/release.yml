name: Build and Release NHSelector

on:
  push:
    branches:
      - master

jobs:
  build:
    # Only runs if the commit message starts with 'v'
    if: startsWith(github.event.head_commit.message, 'v')
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          if (Test-Path requirements.txt) { pip install -r requirements.txt }

      - name: Build with PyInstaller
        run: pyinstaller -F --noconsole NHSelector.py

      - name: Create Release and Upload EXE
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.head_commit.message }}
          name: Release ${{ github.event.head_commit.message }}
          files: dist/NHSelector.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}