name: Build and Release

on:
  push:
    tags:
      - 'v*' # Triggers on any tag push starting with v

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write # Required to create the release and upload assets

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          # If you have other requirements, uncomment the line below:
          # pip install -r requirements.txt

      - name: Build with PyInstaller
        run: |
          pyinstaller -F --noconsole NHSelector.py 

      - name: Create Release and Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/App # PyInstaller puts the output in the dist/ folder
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}